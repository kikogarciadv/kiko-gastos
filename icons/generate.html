<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Generar iconos</title>
<style>
  body { font-family: sans-serif; background: #111; color: #fff; padding: 40px; text-align: center; }
  canvas { display: none; }
  .btn { background: #ff6b35; color: #fff; border: none; padding: 14px 28px; border-radius: 12px;
         font-size: 16px; cursor: pointer; margin: 8px; border-radius: 12px; }
  p { color: #aaa; margin: 16px 0; }
</style>
</head>
<body>
  <h2>🎨 Generador de iconos KikoGastos</h2>
  <p>Pulsa los botones para descargar los iconos PNG necesarios.<br>
  Luego ponlos en la carpeta <code>icons/</code> del proyecto.</p>
  <button class="btn" onclick="generate(192)">Descargar icon-192.png</button>
  <button class="btn" onclick="generate(512)">Descargar icon-512.png</button>
  <canvas id="c"></canvas>

  <script>
    function generate(size) {
      const canvas = document.getElementById('c');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const r = size * 0.22;

      // Background rounded rect
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#FF6B35');
      grad.addColorStop(1, '#FF9A56');
      ctx.fillStyle = '#111111';
      ctx.fillRect(0, 0, size, size);

      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Emoji
      ctx.font = `${size * 0.52}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💸', size / 2, size / 2 + size * 0.04);

      canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `icon-${size}.png`;
        a.click();
      });
    }
  </script>
</body>
</html>
